<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
           body{
               font-family: 'Courier New', Courier, monospace;
            background-color: lightblue;
           



        }
        /*stile della table*/
           table{
            width: 80%;
            border-collapse: collapse;
            margin-top: 120px;
            text-align: left;
            justify-self: center;
            
                
        }
        /*stile dei th*/
        th,td{
            padding: 12px 15px;
            border-bottom: 1px solid #dddddd;

        }
        /*stile del thead*/
        thead{
            background-color: #215259;
            color: #dddddd;
        }

        tbody tr:nth-child(even){
            background-color: #f8f9fa;

        }
        /*pointer per la tabella con i numeri dispari*/
        
        tbody tr:hover{
            background-color: lightblue ;
            cursor: pointer;

        }

        .stile{
            background-color: rgb(249, 254, 255);
            color: #215259;
            width: 50%;
            height: 30px;
            size: 20px;
            margin-top: 5px;
            margin-bottom: 20px;
            color:white;
            font-family: Helvetica;    
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            justify-self: center;
        }

        .stile > a:hover{
            background-color: darkblue;
            cursor: pointer;
            transition-duration: 700ms;
            border-radius: 9px;
            
        }

        
    </style>

</head>
